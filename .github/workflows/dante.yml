name: dante-screener

on:
  # push 트리거 없음: 장중에 코드를 고치면 미완성 일봉이 리포트로 커밋되기 때문 (2026-10-08)
  schedule:
    - cron: "20 11 * * 1-5"  # 20:20 KST, 넥스트레이드 애프터마켓(~20:00)까지 끝난 뒤 일봉으로
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - run: python screener/dante.py
      - run: python screener/dump_prices.py
      - name: commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports data
          git commit -m "report: $(date -u +%F)" || exit 0
          git pull --rebase
          git push
