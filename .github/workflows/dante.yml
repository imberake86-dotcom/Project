name: dante-screener

on:
  push:
    branches: [claude/project-thread-13a1xl]
    paths: [screener/**, .github/workflows/dante.yml]
  schedule:
    - cron: "20 9 * * 1-5"   # 18:20 KST, 시간외 거래까지 끝난 뒤 확정 일봉으로
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - run: python screener/dante.py
      - name: commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports
          git commit -m "report: $(date -u +%F)" || exit 0
          git push
