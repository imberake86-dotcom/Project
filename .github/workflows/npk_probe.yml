name: npk-probe
on:
  push:
    branches: [claude/project-thread-89s4hi]
    paths: [screener/npk_probe.py, .github/workflows/npk_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests
      - run: python screener/npk_probe.py
