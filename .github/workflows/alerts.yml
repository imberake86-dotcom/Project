name: dante-alerts

on:
  push:
    branches: [claude/project-thread-13a1xl]
    paths: [screener/watch.py, screener/alerts.py, .github/workflows/alerts.yml]
  schedule:
    - cron: "50 23 * * 0-4"   # 08:50 KST 월~금, 오전 감시 (12:10까지)
    - cron: "5 3 * * 1-5"     # 12:05 KST, 오후 감시 (오전 감시가 끝나면 이어서 15:31까지)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: watch-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_UNTIL: ${{ github.event.schedule == '50 23 * * 0-4' && '12:10' || '15:31' }}
          WATCH_DEBUG: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          python screener/watch.py
