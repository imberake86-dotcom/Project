name: dante-alerts

on:
  push:
    branches: [claude/project-thread-13a1xl]
    paths: [screener/watch.py, screener/alerts.py, .github/workflows/alerts.yml]
  schedule:
    - cron: "45 23 * * 0-4"   # 08:45 KST 월~금 시작, 09:00~11:59 감시
    - cron: "45 2 * * 1-5"    # 11:45 KST 시작, 12:00~15:40 감시 (종가 확정까지)
  workflow_dispatch:          # 수동 실행·push 는 시세를 한 번만 찍어보는 점검용

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: watch-${{ github.event.schedule || 'manual' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_FROM: ${{ github.event.schedule == '45 23 * * 0-4' && '09:00' || '12:00' }}
          WATCH_UNTIL: ${{ github.event.schedule == '45 23 * * 0-4' && '11:59' || '15:40' }}
          WATCH_DEBUG: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          python screener/watch.py
