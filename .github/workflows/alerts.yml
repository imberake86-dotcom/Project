name: dante-alerts

on:
  push:
    branches: [claude/project-thread-13a1xl]
    paths: [screener/alerts.py, .github/workflows/alerts.yml]
  schedule:
    - cron: "*/30 0-6 * * 1-5"   # 09:00~15:30 KST, 30분 간격
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - run: python screener/alerts.py
      - name: commit alerts
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/alerts.json
          git commit -m "alerts: $(TZ=Asia/Seoul date +'%F %H:%M')" || exit 0
          git pull --rebase
          git push
