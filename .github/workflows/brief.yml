name: watchlist-brief

# 밥그릇 3번 자리 알림 (관심종목 screener/watchlist.txt + 코스피·코스닥 전 종목).
# 결과 reports/bowl/latest.json 의 message 를 프로젝트 루틴이 스레드에 올린다.
on:
  schedule:
    - cron: "40 22 * * 0-4"  # 07:40 KST 월~금, 전일 정규장 종가 기준 (am)
    - cron: "50 6 * * 1-5"   # 15:50 KST 월~금, 당일 정규장 종가 기준 (pm)
  workflow_dispatch:
    inputs:
      mode:
        description: am 또는 pm
        default: pm

permissions:
  contents: write

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '40 22 * * 0-4' && 'am' || 'pm') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install finance-datareader pandas numpy requests
      - run: python screener/bowl.py "$MODE"
      - name: commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/bowl
          git commit -m "bowl ($MODE): $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase
          git push
