name: video-transcript

on:
  push:
    branches: [claude/project-thread-13a1xl]
    paths: [docs/videos.txt, .github/workflows/transcript.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -U yt-dlp
      - name: fetch description and Korean subtitles
        run: |
          mkdir -p docs/videos
          while read -r url; do
            [ -z "$url" ] && continue
            yt-dlp --skip-download --write-description --write-info-json --write-auto-subs --write-subs \
              --sub-langs "ko.*" --sub-format vtt -o "docs/videos/%(id)s.%(ext)s" "$url" || echo "yt-dlp failed: $url"
          done < docs/videos.txt
          for f in docs/videos/*.vtt; do
            [ -f "$f" ] || continue
            grep -v -E '^(WEBVTT|Kind:|Language:|[0-9:.]+ --> |$)' "$f" | sed 's/<[^>]*>//g' | awk '!seen[$0]++' > "${f%.vtt}.txt"
          done
          rm -f docs/videos/*.info.json
          ls -la docs/videos; cat docs/videos/*.description docs/videos/*.txt 2>/dev/null
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/videos
          git commit -m "video transcripts" || exit 0
          git pull --rebase
          git push
